<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Painel do Bot</title>
<style>
  :root {
    --bg: #f6f6f8;
    --surface: #ffffff;
    --border: #e4e4ea;
    --text: #1d1d24;
    --muted: #6b6b78;
    --accent: #c2417a;
    --ok: #1f8a4c;
    --ok-bg: #e5f5ec;
    --bad: #c23b3b;
    --bad-bg: #fbe9e9;
    --warn: #a86a00;
    --warn-bg: #fdf2dc;
    --mono: ui-monospace, "Cascadia Mono", Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #141418;
      --surface: #1d1d23;
      --border: #2e2e37;
      --text: #ececf1;
      --muted: #9a9aa8;
      --accent: #f07aae;
      --ok: #5fd08f;
      --ok-bg: #173323;
      --bad: #f08080;
      --bad-bg: #3a1c1c;
      --warn: #f0c060;
      --warn-bg: #3a2e14;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  .wrap { max-width: 1200px; margin: 0 auto; padding: 20px 16px 48px; }
  header { display: flex; flex-wrap: wrap; align-items: baseline; gap: 8px 16px; margin-bottom: 20px; }
  h1 { font-size: 20px; margin: 0; }
  h1 span { color: var(--accent); }
  .atualizado { color: var(--muted); font-size: 13px; }
  .atualizado.erro { color: var(--bad); }
  header button { margin-left: auto; }
  button {
    font: inherit; font-size: 13px; color: var(--text); background: var(--surface);
    border: 1px solid var(--border); border-radius: 6px; padding: 4px 10px; cursor: pointer;
  }
  button[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); }
  .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; margin-bottom: 16px; }
  .card, section { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; }
  .card { padding: 14px 16px; }
  .card .rotulo { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .04em; }
  .card .valor { font-size: 24px; font-weight: 600; margin-top: 4px; font-variant-numeric: tabular-nums; }
  .card .extra { color: var(--muted); font-size: 13px; margin-top: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .card.ruim .valor { color: var(--bad); }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 16px; }
  @media (max-width: 800px) { .grid2 { grid-template-columns: 1fr; } }
  section { padding: 14px 16px; margin-bottom: 16px; min-width: 0; }
  .grid2 section { margin-bottom: 0; }
  h2 { font-size: 15px; margin: 0 0 10px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .scroll { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 7px 8px; border-top: 1px solid var(--border); vertical-align: top; }
  th { color: var(--muted); font-weight: 500; font-size: 12px; border-top: 0; }
  td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
  td.quando { white-space: nowrap; color: var(--muted); font-variant-numeric: tabular-nums; }
  a { color: var(--accent); text-decoration: none; }
  a:hover { text-decoration: underline; }
  .tag { display: inline-block; font-size: 12px; padding: 1px 8px; border-radius: 999px; white-space: nowrap; }
  .tag.ok { background: var(--ok-bg); color: var(--ok); }
  .tag.bad { background: var(--bad-bg); color: var(--bad); }
  .tag.warn { background: var(--warn-bg); color: var(--warn); }
  .vazio { color: var(--muted); padding: 8px 0; }
  .filtros { display: flex; gap: 6px; flex-wrap: wrap; margin-left: auto; }
  .filtros input {
    font: inherit; font-size: 13px; color: var(--text); background: var(--bg);
    border: 1px solid var(--border); border-radius: 6px; padding: 4px 8px; width: 180px; max-width: 100%;
  }
  .logs { font-family: var(--mono); font-size: 12.5px; max-height: 480px; overflow: auto; }
  .log { display: grid; grid-template-columns: 112px 64px 1fr; gap: 8px; padding: 3px 0; border-top: 1px solid var(--border); }
  .log .msg { white-space: pre-wrap; word-break: break-word; }
  .log .q { color: var(--muted); }
  .log.WARNING .n { color: var(--warn); }
  .log.ERROR .n, .log.CRITICAL .n { color: var(--bad); }
  .log.INFO .n { color: var(--muted); }
  @media (max-width: 600px) {
    .log { grid-template-columns: 1fr; gap: 0; }
    .log .q, .log .n { display: inline; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>diquinhas <span>&amp;</span> promos</h1>
    <span class="atualizado" id="atualizado">carregando…</span>
    <button id="pausar" aria-pressed="false">Pausar atualização</button>
  </header>

  <div class="cards">
    <div class="card"><div class="rotulo">No ar há</div><div class="valor" id="no-ar">–</div></div>
    <div class="card"><div class="rotulo">Próximo disparo</div><div class="valor" id="prox-em">–</div><div class="extra" id="prox-nicho"></div></div>
    <div class="card"><div class="rotulo">Postagens hoje</div><div class="valor" id="post-hoje">–</div><div class="extra" id="ultimo"></div></div>
    <div class="card" id="card-falhas"><div class="rotulo">Falhas hoje</div><div class="valor" id="falhas-hoje">–</div></div>
  </div>

  <div class="grid2">
    <section>
      <h2>Próximos disparos</h2>
      <div class="scroll"><table><thead><tr><th>Quando</th><th>Nicho</th><th class="num">Em</th></tr></thead><tbody id="proximos"></tbody></table></div>
    </section>
    <section>
      <h2>Últimos disparos</h2>
      <div class="scroll"><table><thead><tr><th>Quando</th><th>Nicho</th><th>Resultado</th></tr></thead><tbody id="disparos"></tbody></table></div>
    </section>
  </div>

  <section>
    <h2>Últimas postagens</h2>
    <div class="scroll"><table><thead><tr><th>Quando</th><th>Nicho</th><th>Produto</th><th class="num">Preço</th><th>Loja</th></tr></thead><tbody id="postagens"></tbody></table></div>
  </section>

  <section>
    <h2>
      Log
      <span class="filtros">
        <button data-nivel="todos" aria-pressed="true">Tudo</button>
        <button data-nivel="WARNING" aria-pressed="false">Avisos e erros</button>
        <button data-nivel="ERROR" aria-pressed="false">Só erros</button>
        <input id="busca" type="search" placeholder="Buscar no log…">
      </span>
    </h2>
    <div class="logs" id="logs"></div>
  </section>
</div>

<script>
  const NIVEIS = { DEBUG: 10, INFO: 20, WARNING: 30, ERROR: 40, CRITICAL: 50 };
  let pausado = false;
  let filtroNivel = "todos";
  let ultimoStatus = null;

  const $ = (id) => document.getElementById(id);

  function el(tag, props = {}, ...filhos) {
    const node = document.createElement(tag);
    for (const [k, v] of Object.entries(props)) {
      if (k === "class") node.className = v;
      else if (k === "text") node.textContent = v;
      else node.setAttribute(k, v);
    }
    for (const f of filhos) node.append(f);
    return node;
  }

  function duracao(seg) {
    const d = Math.floor(seg / 86400), h = Math.floor(seg % 86400 / 3600), m = Math.floor(seg % 3600 / 60);
    if (d) return `${d}d ${h}h`;
    if (h) return `${h}h ${m}min`;
    return `${m}min`;
  }

  const brl = (v) => v == null ? "–" : v.toLocaleString("pt-BR", { style: "currency", currency: "BRL" });

  function preencher(tbody, linhas, colunas, msgVazio) {
    tbody.replaceChildren();
    if (!linhas.length) {
      tbody.append(el("tr", {}, el("td", { colspan: String(colunas), class: "vazio", text: msgVazio })));
      return;
    }
    for (const celulas of linhas) tbody.append(el("tr", {}, ...celulas));
  }

  function renderLogs() {
    if (!ultimoStatus) return;
    const busca = $("busca").value.trim().toLowerCase();
    const minimo = filtroNivel === "todos" ? 0 : NIVEIS[filtroNivel];
    const caixa = $("logs");
    const itens = ultimoStatus.logs.filter((l) =>
      (NIVEIS[l.nivel] ?? 0) >= minimo &&
      (!busca || `${l.origem} ${l.mensagem}`.toLowerCase().includes(busca)));
    caixa.replaceChildren(...(itens.length ? itens.map((l) =>
      el("div", { class: `log ${l.nivel}` },
        el("span", { class: "q", text: l.quando }),
        el("span", { class: "n", text: l.nivel }),
        el("span", { class: "msg", text: `[${l.origem}] ${l.mensagem}` }))) :
      [el("div", { class: "vazio", text: "Nenhuma mensagem." })]));
  }

  function render(s) {
    ultimoStatus = s;
    $("no-ar").textContent = duracao(s.no_ar_segundos);

    const prox = s.proximos[0];
    $("prox-em").textContent = prox ? duracao(prox.em_segundos) : "–";
    $("prox-nicho").textContent = prox ? `${prox.nicho} · ${prox.quando}` : "nenhum agendado";

    $("post-hoje").textContent = s.resumo.postagens_hoje;
    const ult = s.resumo.ultimo_disparo;
    $("ultimo").textContent = ult ? `último: ${ult.nicho} às ${ult.data.split(" ")[1]} ${ult.sucesso ? "✓" : "✗"}` : "nenhum disparo ainda";
    $("falhas-hoje").textContent = s.resumo.falhas_hoje;
    $("card-falhas").classList.toggle("ruim", s.resumo.falhas_hoje > 0);

    preencher($("proximos"), s.proximos.slice(0, 12).map((p) => [
      el("td", { class: "quando", text: p.quando }),
      el("td", { text: p.nicho }),
      el("td", { class: "num", text: duracao(p.em_segundos) }),
    ]), 3, "Nenhum disparo agendado.");

    preencher($("disparos"), s.disparos.map((d) => [
      el("td", { class: "quando", text: d.data }),
      el("td", { text: d.nicho }),
      el("td", {}, el("span", { class: `tag ${d.sucesso ? "ok" : "bad"}`, text: d.sucesso ? "publicou" : "não publicou" }), " ", d.detalhe || ""),
    ]), 3, "Nenhum disparo registrado ainda.");

    preencher($("postagens"), s.postagens.map((p) => {
      const nome = p.titulo || p.id_produto;
      const produto = p.link && /^https?:\/\//.test(p.link)
        ? el("a", { href: p.link, target: "_blank", rel: "noopener noreferrer", text: nome })
        : nome;
      return [
        el("td", { class: "quando", text: p.data_envio }),
        el("td", { text: p.nicho }),
        el("td", {}, produto),
        el("td", { class: "num", text: brl(p.preco) }),
        el("td", {}, p.loja ? el("span", { class: "tag warn", text: p.loja.replace("_", " ") }) : ""),
      ];
    }), 5, "Nenhuma postagem registrada ainda.");

    renderLogs();
  }

  async function atualizar() {
    if (pausado) return;
    const info = $("atualizado");
    try {
      const resp = await fetch("/api/status", { cache: "no-store" });
      if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
      render(await resp.json());
      info.textContent = `atualizado às ${ultimoStatus.agora.split(" ")[1]}`;
      info.classList.remove("erro");
    } catch (e) {
      info.textContent = `sem conexão com o bot (${e.message}) — tentando de novo…`;
      info.classList.add("erro");
    }
  }

  $("pausar").addEventListener("click", (ev) => {
    pausado = !pausado;
    ev.target.setAttribute("aria-pressed", String(pausado));
    ev.target.textContent = pausado ? "Retomar atualização" : "Pausar atualização";
    if (!pausado) atualizar();
  });
  document.querySelectorAll("[data-nivel]").forEach((b) => b.addEventListener("click", () => {
    filtroNivel = b.dataset.nivel;
    document.querySelectorAll("[data-nivel]").forEach((x) => x.setAttribute("aria-pressed", String(x === b)));
    renderLogs();
  }));
  $("busca").addEventListener("input", renderLogs);

  atualizar();
  setInterval(atualizar, 10000);
</script>
</body>
</html>
